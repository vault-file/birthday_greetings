<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="album.css">

    <title>Just For You, Love</title>
</head>

<body>

    <main class="album-page">

        <section class="album-header">

            <p class="small-title">
                🌸 A little something for you 🌸
            </p>

            <h1>
                Just For You, Love
            </h1>

            <p class="subtitle">
                Just a few pictures of my beautiful girl,
                because one picture is never enough. ♡
            </p>

        </section>

        <section class="photo-section">

            <div class="photo-stack" id="photoStack">

                <div class="photo-card photo-6">
                    <img src="album/album1 (6).jpg" alt="Photo 6">
                </div>

                <div class="photo-card photo-5">
                    <img src="album/album1 (5).jpg" alt="Photo 5">
                </div>

                <div class="photo-card photo-4">
                    <img src="album/album1 (4).jpg" alt="Photo 4">
                </div>

                <div class="photo-card photo-3">
                    <img src="album/album1 (3).jpg" alt="Photo 3">
                </div>

                <div class="photo-card photo-2">
                    <img src="album/album1 (2).jpg" alt="Photo 2">
                </div>

                <div class="photo-card photo-1">
                    <img src="album/album1 (1).jpg" alt="Photo 1">
                </div>

            </div>

            <p class="photo-instruction" id="photoInstruction">
                Tap the photo 🌷
            </p>

        </section>

        <section class="cat-section" id="catSection">

            <div class="cat-gifs">

                <img src="album/cat (1).gif" class="cat-gif" alt="Dancing cat">

                <img src="album/cat (2).gif" class="cat-gif" alt="Dancing cat">

            </div>

            <p class="love-message" id="loveMessage">
                I love you so much ❤️
            </p>

        </section>

        <section class="message-card" id="messageCard">

            <p class="message-label">
                For you, My Love ♡
            </p>

            <p class="message-text" id="messageText"></p>

            <p class="credit" id="credit">
                Made with love ♡<br>
                Your baby boy
            </p>

        </section>

    </main>

    <audio id="backgroundMusic" src="music/constant by Jeremy passion.mp3" loop preload="auto"></audio>

    <audio id="typewriterSound" src="sound_effects/typewriter.wav" preload="auto"></audio>

    <script src="album.js"></script>

</body>

</html>
